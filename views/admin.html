<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orvella Events | Admin Dashboard</title><link rel="stylesheet" href="/admin.css"></head><body><header class="admin-nav"><a class="brand" href="/"><span class="brand-mark">O</span><span><strong>ORVELLA</strong><small>EVENTS ADMIN</small></span></a><div><a class="view-site" href="/">View Website</a><form method="POST" action="/logout" class="inline"><button class="logout">Logout</button></form></div></header><main class="dashboard"><div class="top"><div><p class="eyebrow">CONTROL PANEL</p><h1>Admin Dashboard</h1></div><button class="refresh" onclick="loadData()">Refresh</button></div><div class="stats"><div><span id="bookingCount">0</span><small>Total Bookings</small></div><div><span id="enquiryCount">0</span><small>Total Enquiries</small></div></div><section><div class="section-title"><h2>Booking Requests</h2></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Event</th><th>Date</th><th>Guests</th><th>Location</th><th>Budget</th><th>Message</th><th>Received</th><th></th></tr></thead><tbody id="bookings"></tbody></table></div></section><section><div class="section-title"><h2>Enquiries</h2></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Email</th><th>Subject</th><th>Message</th><th>Received</th><th></th></tr></thead><tbody id="enquiries"></tbody></table></div></section></main><script>
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
async function loadData(){const r=await fetch("/api/admin/data");if(!r.ok){location="/admin-login";return}const d=await r.json();bookingCount.textContent=d.stats.bookings;enquiryCount.textContent=d.stats.enquiries;bookings.innerHTML=d.bookings.length?d.bookings.map(b=>`<tr><td>${b.id}</td><td><strong>${esc(b.name)}</strong><br>${esc(b.email)}</td><td>${esc(b.phone)}</td><td>${esc(b.event_type)}</td><td>${esc(b.event_date)}</td><td>${esc(b.guests)}</td><td>${esc(b.location)}</td><td>${esc(b.budget)}</td><td>${esc(b.message)}</td><td>${esc(b.created_at)}</td><td><button class="delete" onclick="deleteItem('bookings',${b.id})">Delete</button></td></tr>`).join(""):`<tr><td colspan="11" class="empty">No booking requests yet.</td></tr>`;enquiries.innerHTML=d.enquiries.length?d.enquiries.map(e=>`<tr><td>${e.id}</td><td><strong>${esc(e.name)}</strong></td><td>${esc(e.phone)}</td><td>${esc(e.email)}</td><td>${esc(e.subject)}</td><td>${esc(e.message)}</td><td>${esc(e.created_at)}</td><td><button class="delete" onclick="deleteItem('enquiries',${e.id})">Delete</button></td></tr>`).join(""):`<tr><td colspan="8" class="empty">No enquiries yet.</td></tr>`}
async function deleteItem(type,id){if(!confirm("Delete this record?"))return;await fetch(`/api/admin/${type}/${id}`,{method:"DELETE"});loadData()}loadData();
</script></body></html>
